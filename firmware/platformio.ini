; ── Shared settings for every device ─────────────────────────
[platformio]
default_envs = dots1
; Per-device secrets (AUDIT 3.4). Optional: copy secrets.ini.example to
; secrets.ini (gitignored). Without it, devices build exactly as before.
extra_configs = secrets.ini

; Empty defaults, overridden by secrets.ini
[secrets]
dots1 =
dots2 =
dots3 =

[env]
platform         = espressif32 @ 7.0.1   ; Arduino core 2.0.17 (legacy driver/i2s.h breaks on 3.x)
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
monitor_filters  = esp32_exception_decoder, default
lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
; Normal builds use main.cpp only (pintest.cpp is the wiring test)
build_src_filter = +<*> -<pintest.cpp>

; ── One block per physical device ────────────────────────────
[env:dots1]
build_flags = -D DEVICE_CODE=\"DOTS-0001\" ${secrets.dots1}

[env:dots2]
build_flags = -D DEVICE_CODE=\"DOTS-0002\" ${secrets.dots2}

[env:dots3]
build_flags = -D DEVICE_CODE=\"DOTS-0003\" ${secrets.dots3}

; ── Wiring test, one state per upload ───────────────────────
[env:state1]
build_src_filter = -<*> +<pintest.cpp>
build_flags = -D STATE=1

[env:state2]
build_src_filter = -<*> +<pintest.cpp>
build_flags = -D STATE=2

[env:state3]
build_src_filter = -<*> +<pintest.cpp>
build_flags = -D STATE=3

[env:state4]
build_src_filter = -<*> +<pintest.cpp>
build_flags = -D STATE=4

[env:state5]
build_src_filter = -<*> +<pintest.cpp>
build_flags = -D STATE=5