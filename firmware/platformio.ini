; ── Shared settings for every device ─────────────────────────
[platformio]
default_envs = dots1

[env]
platform         = espressif32 @ 7.0.1   ; Arduino core 2.0.17 (legacy driver/i2s.h breaks on 3.x)
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
monitor_filters  = esp32_exception_decoder, default
lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17

; ── One block per physical device ────────────────────────────
[env:dots1]
build_flags = -D DEVICE_CODE=\"DOTS-0001\"

[env:dots2]
build_flags = -D DEVICE_CODE=\"DOTS-0002\"

[env:dots3]
build_flags = -D DEVICE_CODE=\"DOTS-0003\"